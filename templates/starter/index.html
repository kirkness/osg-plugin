<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Seed Dash</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app">
      <header id="hud">
        <span id="score">0</span>
        <span id="time">30</span>
        <span id="best">Best 0</span>
      </header>
      <canvas id="stage" width="800" height="500" aria-label="Seed Dash arena"></canvas>
      <section id="panel">
        <h1>Seed Dash</h1>
        <p id="blurb">Eat more seeds than the rival. Arrows, WASD or drag.</p>
        <p id="result" role="status"></p>
        <div class="row">
          <button id="go" type="button">Play</button>
          <button id="board" type="button" hidden>Leaderboard</button>
          <button id="friends" type="button" hidden>Play with friends</button>
        </div>
        <p id="room" role="status"></p>
      </section>
      <!-- The leaderboard is a game screen: drawn here in the game's own style from osg.leaderboards data (see src/board.ts). -->
      <section id="scores" class="card" hidden aria-labelledby="scores-title">
        <div class="card-head">
          <h2 id="scores-title">Best round</h2>
          <button id="scores-close" class="ghost" type="button" aria-label="Back to the menu">Back</button>
        </div>
        <div id="periods" class="tabs" role="group" aria-label="Which scores"></div>
        <p id="scores-status" class="muted" role="status" aria-live="polite"></p>
        <ol id="rows" class="rows"></ol>
        <p id="you" class="you-line"></p>
        <p id="scores-note" class="muted small"></p>
        <div class="row">
          <button id="scores-retry" type="button" hidden>Try again</button>
          <button id="scores-signin" class="ghost" type="button" hidden>Sign in</button>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
